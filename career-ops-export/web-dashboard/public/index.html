<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>career-ops dashboard</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#272b35; --text:#e6e6e6; --muted:#8a8f9c; --accent:#5ec9a8; --red:#e08a8a; --amber:#d6c17e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; margin:0; }
  nav { display:flex; gap:8px; padding:0 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  nav button { background:none; border:none; color:var(--muted); padding:12px 16px; cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
  nav button.active { color:var(--text); border-bottom-color:var(--accent); }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; cursor:pointer; user-select:none; }
  th:hover { color:var(--text); }
  tr:hover { background:var(--panel); }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; }
  .badge.SKIP, .badge.Discarded, .badge.Rejected { background:#3a2222; color:var(--red); }
  .badge.Evaluated { background:#2a2f3a; color:#9bb0d6; }
  .badge.Applied, .badge.Responded { background:#22323a; color:#7ec8d6; }
  .badge.Interview, .badge.Offer { background:#22392b; color:var(--accent); }
  .score.high { color:var(--accent); }
  .score.mid { color:var(--amber); }
  .score.low { color:var(--red); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .card .meta { color:var(--muted); font-size:13px; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); }
  .toggle-row .name { font-size:14px; }
  .toggle-row .url { color:var(--muted); font-size:12px; }
  .switch { position:relative; width:38px; height:20px; flex:0 0 auto; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:#333; border-radius:10px; cursor:pointer; transition:.2s; }
  .slider:before { content:''; position:absolute; width:16px; height:16px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider { background:var(--accent); }
  input:checked + .slider:before { transform:translateX(18px); }
  button.primary { background:var(--accent); color:#0f1115; border:none; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:6px; cursor:pointer; }
  input[type=text], input[type=number], select, textarea {
    background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:13px;
  }
  textarea { width:100%; font-family:inherit; }
  pre.raw { white-space:pre-wrap; background:var(--panel); border:1px solid var(--border); padding:16px; border-radius:8px; font-size:13px; }
  .report-html { background:var(--panel); border:1px solid var(--border); padding:20px; border-radius:8px; }
  .report-html h1, .report-html h2, .report-html h3 { border-bottom:1px solid var(--border); padding-bottom:6px; }
  .report-html table { margin:12px 0; }
  .report-html table th, .report-html table td { border:1px solid var(--border); }
  .report-html code { background:#1f232c; padding:1px 5px; border-radius:4px; }
  .report-html pre code { display:block; padding:10px; overflow-x:auto; }
  .muted { color:var(--muted); }
  a { color:var(--accent); }
  .stats { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 18px; min-width:120px; }
  .stat .num { font-size:22px; font-weight:600; }
  .stat .label { color:var(--muted); font-size:12px; }
  .toolbar { display:flex; gap:10px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
  .form-grid { display:grid; grid-template-columns:160px 1fr; gap:10px 14px; align-items:start; margin-bottom:18px; }
  .form-grid label { color:var(--muted); font-size:13px; padding-top:6px; }
  .compare-grid { display:grid; gap:14px; }
  @media (min-width: 700px) { .compare-grid.cols-2 { grid-template-columns:1fr 1fr; } .compare-grid.cols-3 { grid-template-columns:1fr 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>career-ops dashboard</h1>
  <span class="muted" id="status"></span>
</header>
<nav>
  <button data-tab="tracker" class="active">Tracker</button>
  <button data-tab="reports">Reports</button>
  <button data-tab="portals">Portals</button>
  <button data-tab="profile">Profile</button>
  <button data-tab="patterns">Patterns</button>
</nav>
<main id="main"></main>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
